<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kaiju Basho</title>
<style>
:root {
  --ink: #1a1410; --paper: #e4d5b0; --paper-dk: #d3c093; --paper-lt: #efe4c6;
  --red: #d6321f; --teal: #1f6f66; --teal-lt: #7fe0d0; --yellow: #f2c230; --night: #101a3a;
  --display: "Avenir Next Condensed", "DIN Condensed", "Futura Condensed", "Arial Narrow", "Liberation Sans Narrow", "Nimbus Sans Narrow", Impact, sans-serif;
  --text: "American Typewriter", "Rockwell", "Courier Prime", "Georgia", serif;
  --jp: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif CJK JP", serif;
  --jpg: "Hiragino Sans", "Yu Gothic", "Meiryo", "Noto Sans CJK JP", sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
body { font-family: var(--text); color: var(--ink); -webkit-user-select: none; user-select: none; }
#stage { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; transform-origin: 0 0; overflow: hidden; background: #000; }
#cv { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; display: block; }
.layer { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; display: none; }
.layer.on { display: block; }
.jp { font-family: var(--jpg); }
.jpm { font-family: var(--jp); }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, [tabindex]:focus-visible, input:focus-visible { outline: 3px solid var(--teal-lt); outline-offset: 2px; }

/* poster buttons: flat ink, hard offset shadow, like a two-colour print */
.btn { white-space: nowrap; font-family: var(--display); font-weight: 800; font-size: 24px; letter-spacing: .02em; padding: 8px 22px 7px; background: var(--yellow); border: 3px solid var(--ink); box-shadow: 4px 4px 0 var(--ink); text-transform: uppercase; line-height: 1.1; }
.btn:hover { background: #ffd95a; }
.btn:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--ink); }
.btn.red { background: var(--red); color: #fff3d6; }
.btn.red:hover { background: #ea4a34; }
.btn.plain { background: var(--paper-lt); }
.btn.small { font-size: 17px; padding: 5px 12px 4px; box-shadow: 3px 3px 0 var(--ink); border-width: 2px; }
.btn[disabled] { background: #b9ad8d; color: #6d6450; cursor: not-allowed; box-shadow: 2px 2px 0 var(--ink); }

/* ---------- title ---------- */
#title .shade { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(8,6,16,.86) 0%, rgba(8,6,16,.55) 38%, rgba(8,6,16,0) 62%); }
#title .left { position: absolute; left: 70px; top: 70px; width: 640px; }
#title h1 { margin: 0; font-family: var(--display); font-weight: 900; font-style: italic; font-size: 148px; line-height: .86; color: var(--yellow); -webkit-text-stroke: 3px var(--ink); text-shadow: 6px 6px 0 var(--red), 9px 9px 0 var(--ink); letter-spacing: -.01em; }
#title .kanji { position: absolute; right: 60px; top: 60px; writing-mode: vertical-rl; font-family: var(--jp); font-weight: 900; font-size: 86px; color: #fff3d6; text-shadow: 4px 4px 0 var(--red), 7px 7px 0 var(--ink); letter-spacing: .08em; }
#title .tag { margin: 26px 0 22px 6px; width: 540px; font-size: 19px; line-height: 1.36; color: #fff3d6; text-shadow: 1px 1px 0 var(--ink); }
#title .menu { margin-left: 6px; display: flex; flex-direction: column; gap: 14px; align-items: flex-start; }
#title .foot { position: absolute; left: 76px; bottom: 26px; font-size: 14px; color: #d9c79a; width: 760px; line-height: 1.4; }

/* ---------- paper screens ---------- */
.paper { background-color: var(--paper); background-image: radial-gradient(rgba(26,20,16,.085) 1px, transparent 1.3px), radial-gradient(rgba(26,20,16,.05) 1px, transparent 1.3px), linear-gradient(180deg, rgba(255,250,230,.35), rgba(160,130,70,.18)); background-size: 5px 5px, 7px 7px, 100% 100%; background-position: 0 0, 2px 3px, 0 0; }
.rule { border: 0; border-top: 3px double var(--ink); margin: 6px 0; }
h2.head { font-family: var(--display); font-weight: 900; font-style: italic; font-size: 46px; margin: 0; line-height: 1; color: var(--red); text-transform: uppercase; }
.stamp { display: inline-block; font-family: var(--display); font-weight: 800; color: var(--red); border: 2px solid var(--red); padding: 0 6px; transform: rotate(-3deg); font-size: 15px; text-transform: uppercase; }

/* hatchery */
#hatch .wrap { position: absolute; inset: 26px 40px; }
#hatch .eggs { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px; margin-top: 12px; }
.egg { border: 3px solid var(--ink); background: var(--paper-lt); padding: 4px 6px 8px; cursor: pointer; position: relative; text-align: center; font-family: var(--text); }
.egg.sel { box-shadow: 0 0 0 5px var(--red); }
.egg canvas { display: block; margin: 0 auto; width: 100%; max-width: 168px; height: auto; }
.egg h3 { font-family: var(--display); font-weight: 900; font-size: 19px; line-height: 1; margin: 4px 0 0; text-transform: uppercase; white-space: nowrap; }
.egg .kind { font-size: 14px; margin-top: 3px; }
.egg .kind span { font-family: var(--jpg); color: var(--teal); margin-left: 6px; font-weight: 700; }
#hatch .eggInfo { border-top: 3px solid var(--ink); margin-top: 14px; padding-top: 6px; min-height: 104px; max-width: 980px; }
#hatch .eggInfo p { margin: 4px 0 0; font-size: 17px; line-height: 1.3; }
#hatch .eggInfo .perk { color: var(--red); font-weight: 700; }
#hatch .eggInfo .terms { font-size: 15px; }
#hatch .row { display: flex; gap: 26px; align-items: flex-end; margin-top: 16px; }
#hatch label { display: block; font-family: var(--display); font-weight: 800; font-size: 19px; text-transform: uppercase; }
#hatch input[type=text] { font-family: var(--display); font-weight: 800; font-size: 30px; width: 300px; padding: 4px 10px; border: 3px solid var(--ink); background: #fff8e2; color: var(--ink); text-transform: uppercase; }
.seg { display: flex; }
.seg button { font-family: var(--display); font-weight: 800; font-size: 19px; padding: 7px 14px; border: 3px solid var(--ink); background: var(--paper-lt); margin-right: -3px; text-transform: uppercase; }
.seg button.sel { background: var(--teal); color: #fff3d6; }
#hatch .dnote { font-size: 14px; margin-top: 5px; min-height: 18px; }

/* ---------- the lab: anatomy chart + catalog + scouting slip ---------- */
#lab .col { position: absolute; top: 0; bottom: 0; }
#lab .chart { left: 0; width: 418px; border-right: 3px solid var(--ink); }
#lab .cat { left: 418px; width: 432px; border-right: 3px solid var(--ink); }
#lab .scout { left: 850px; width: 430px; background: rgba(255,250,232,.45); }
#lab .chart .top { position: absolute; left: 16px; top: 10px; right: 12px; }
#lab .kname { font-family: var(--display); font-weight: 900; font-style: italic; font-size: 44px; line-height: .95; text-transform: uppercase; color: var(--red); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#lab .kep { font-size: 16px; margin-top: 1px; }
#chartCv { position: absolute; left: 0; top: 72px; }
.callout { position: absolute; font-family: var(--display); font-weight: 800; font-size: 16px; line-height: 1.02; background: var(--paper-lt); border: 2px solid var(--ink); padding: 3px 6px 2px 30px; cursor: pointer; min-width: 112px; max-width: 150px; text-transform: uppercase; text-align: left; }
.callout b { position: absolute; left: 0; top: 0; bottom: 0; width: 25px; background: var(--ink); color: var(--paper-lt); font-family: var(--jp); font-size: 17px; display: flex; align-items: center; justify-content: center; font-weight: 900; }
.callout small { display: block; font-family: var(--text); font-weight: 400; font-size: 11.5px; text-transform: none; color: #5a4f3c; }
.callout.sel { background: var(--yellow); }
.callout.sel b { background: var(--red); }
.callout.empty { color: #7d7159; border-style: dashed; }
.callout .t2 { color: var(--red); }
#lab .stats { position: absolute; left: 14px; right: 12px; bottom: 132px; display: flex; gap: 6px; }
.stat { flex: 1; border: 2px solid var(--ink); background: var(--paper-lt); padding: 2px 6px 3px; }
.stat i { font-style: normal; font-size: 12px; display: block; }
.stat b { font-family: var(--display); font-size: 25px; font-weight: 900; line-height: 1; }
#lab .sund { position: absolute; left: 14px; right: 12px; bottom: 10px; }
#lab .sund h4, #lab .scout h4, #lab .cat h4 { font-family: var(--display); font-weight: 900; font-size: 17px; margin: 0 0 3px; text-transform: uppercase; letter-spacing: .03em; }
.sundrow { display: flex; gap: 6px; }
.sundry { flex: 1; height: 96px; border: 2px solid var(--ink); background: var(--paper-lt); padding: 3px 6px 4px; text-align: left; font-family: var(--text); position: relative; }
.sundry:hover:not([disabled]) { background: #fff3c4; }
.sundry[disabled] { opacity: .55; cursor: not-allowed; }
.sundry b { font-family: var(--display); font-size: 17px; font-weight: 800; display: block; text-transform: uppercase; line-height: 1.05; }
.sundry span { font-size: 12px; display: block; line-height: 1.2; }
.sundry em { font-style: normal; font-family: var(--display); font-weight: 900; font-size: 18px; color: var(--red); }
.pips { letter-spacing: 1px; font-size: 10px; }

#lab .cat .tabs { position: absolute; left: 0; right: 0; top: 0; display: flex; border-bottom: 3px solid var(--ink); }
.tab { flex: 1; padding: 5px 0 3px; border: 0; border-right: 2px solid var(--ink); background: var(--paper-dk); font-family: var(--display); font-weight: 800; font-size: 16px; text-transform: uppercase; line-height: 1; position: relative; }
.tab:last-child { border-right: 0; }
.tab b { display: block; font-family: var(--jp); font-size: 21px; font-weight: 900; }
.tab.sel { background: var(--paper); box-shadow: inset 0 5px 0 var(--red); }
.tab .dot { position: absolute; right: 5px; top: 6px; width: 9px; height: 9px; border-radius: 50%; background: var(--teal); border: 1.5px solid var(--ink); }
.tab .dot.t2 { background: var(--red); }
#lab .cat .items { position: absolute; left: 10px; right: 10px; top: 60px; bottom: 6px; display: flex; flex-direction: column; gap: 7px; }
.item { flex: 1; border: 2.5px solid var(--ink); background: var(--paper-lt); padding: 6px 9px 5px; position: relative; min-height: 0; overflow: hidden; display: flex; flex-direction: column; }
.item.owned { background: #fff6cf; box-shadow: inset 6px 0 0 var(--teal); padding-left: 14px; }
.item .hd { display: flex; gap: 9px; align-items: flex-start; }
.item .ico { width: 42px; height: 42px; flex: none; margin-top: 2px; }
.item .ttl { flex: 1; min-width: 0; }
.item h3 { font-family: var(--display); font-weight: 900; font-size: 25px; margin: 0; text-transform: uppercase; line-height: .95; }
.item h3 span { font-family: var(--jpg); font-size: 14px; font-weight: 700; color: var(--teal); margin-left: 7px; white-space: nowrap; }
.item .pitch { font-style: italic; font-size: 13px; margin: 2px 0 0; color: #4c4232; line-height: 1.2; }
.item .role { font-size: 13.2px; line-height: 1.24; margin: 4px 0 3px; }
.item ul.facts { margin: 0; padding: 0 0 0 14px; font-size: 12.2px; line-height: 1.22; columns: 2; column-gap: 22px; }
.item ul.facts li { break-inside: avoid; }
.item .buy { flex: none; text-align: right; min-width: 104px; }
.item .price { font-family: var(--display); font-weight: 900; font-size: 25px; color: var(--red); line-height: 1; }
.item .price s { color: #7d7159; font-size: 15px; margin-right: 5px; }
.item .sub { font-size: 11px; line-height: 1.15; min-height: 3px; margin-bottom: 3px; }
.item .sub.short { color: var(--red); margin-top: 4px; }
.item .ft { margin-top: auto; padding-top: 3px; font-size: 12px; display: flex; gap: 8px; align-items: center; }
.item .ft .no { margin-left: auto; font-size: 10.5px; color: #6d6450; }
.item .evo { color: #4c4232; cursor: help; }
.item .evo b { font-family: var(--display); font-size: 14px; text-transform: uppercase; color: var(--red); }
.item .sale { position: absolute; right: -2px; bottom: -2px; background: var(--red); color: #fff3d6; font-family: var(--display); font-weight: 900; font-size: 12px; padding: 1px 6px; text-transform: uppercase; }
.item .stamp { font-size: 12px; }
.linkbtn { background: none; border: 0; padding: 0; font-family: var(--text); font-size: 12px; text-decoration: underline; color: var(--teal); }

#lab .scout .in { position: absolute; inset: 8px 14px 8px 14px; display: flex; flex-direction: column; }
#lab .scout .match { flex: 1; min-height: 0; overflow-y: auto; padding-right: 4px; }
.yenbox { display: flex; align-items: baseline; justify-content: space-between; border-bottom: 3px double var(--ink); padding-bottom: 3px; }
.yenbox .y { font-family: var(--display); font-weight: 900; font-size: 44px; line-height: .9; color: var(--ink); }
.yenbox .l { font-size: 13px; }
.ladder { display: flex; gap: 3px; margin: 7px 0 6px; }
.rung { flex: 1; border: 2px solid var(--ink); background: var(--paper-lt); text-align: center; font-family: var(--display); font-weight: 800; font-size: 12px; line-height: 1.05; padding: 2px 0 2px; text-transform: uppercase; position: relative; height: 40px; overflow: hidden; }
.rung b { display: block; font-family: var(--jp); font-size: 15px; }
.rung.won { background: var(--teal); color: #fff3d6; }
.rung.now { background: var(--yellow); box-shadow: 0 0 0 2px var(--red); }
.opp { display: flex; gap: 10px; }
.opp canvas { border: 2px solid var(--ink); background: linear-gradient(180deg, #2a3560, #c2604c 70%, #b79a6a 70%); flex: none; }
.opp .who { flex: 1; min-width: 0; }
.opp h3 { font-family: var(--display); font-weight: 900; font-style: italic; font-size: 34px; margin: 0; line-height: .9; text-transform: uppercase; color: var(--red); }
.opp .kat { font-family: var(--jpg); font-weight: 700; font-size: 14px; color: var(--teal); }
.opp .ttl { font-size: 14px; font-style: italic; }
.opp .nums { font-family: var(--display); font-weight: 800; font-size: 17px; margin-top: 2px; }
.opp .sty { font-size: 12.8px; line-height: 1.25; margin-top: 3px; }
.tchips { display: flex; flex-wrap: wrap; gap: 4px; margin: 6px 0 4px; }
.tchip { border: 2px solid var(--ink); background: var(--paper-lt); font-family: var(--display); font-weight: 800; font-size: 14.5px; padding: 1px 6px 0 24px; text-transform: uppercase; position: relative; line-height: 1.25; cursor: help; }
.tchip img { position: absolute; left: 4px; top: 2px; width: 15px; height: 15px; }
.tchip.t2 { background: var(--ink); color: var(--yellow); }
.tchips.cmp { margin: 3px 0 2px; gap: 3px; }
.tchips.cmp .tchip { font-size: 12.5px; padding: 0 5px 0 20px; }
.tchips.cmp .tchip img { width: 13px; height: 13px; top: 1px; }
.opp.cmp .sty { display: none; }
.opp.cmp h3 { font-size: 30px; }
.ladder + h4 { margin-top: 0; }
.match { font-size: 12.6px; line-height: 1.26; }
.match table { border-collapse: collapse; width: 100%; }
.match td { padding: 1px 3px 0 0; vertical-align: top; border-bottom: 1px dotted rgba(26,20,16,.35); }
.match td.n { font-family: var(--display); font-weight: 800; font-size: 15px; white-space: nowrap; text-transform: uppercase; }
.match td.v { font-family: var(--display); font-weight: 900; font-size: 16px; text-align: right; white-space: nowrap; width: 62px; }
.match td.v.bad { color: var(--red); }
.match td.v.up { color: var(--teal); }
.match .note { color: #5a4f3c; }
.quote { font-style: italic; font-size: 13px; margin: 4px 0 0; border-left: 4px solid var(--red); padding-left: 7px; }
#lab .go { flex: none; margin-top: 6px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
#lab .go .btn.red { font-size: 22px; padding: 8px 16px 7px; }
#lab .coach { position: absolute; left: 862px; bottom: 84px; width: 406px; z-index: 5; }

/* coach bubble */
.coachb { background: #fff8e2; border: 3px solid var(--ink); box-shadow: 5px 5px 0 var(--red); padding: 8px 12px 9px; font-size: 15.5px; line-height: 1.32; }
.coachb b.who { font-family: var(--display); font-weight: 900; font-size: 15px; text-transform: uppercase; color: var(--teal); display: block; }

/* ---------- versus card ---------- */
#versus { background: rgba(6,6,14,.5); }
#versus .band { position: absolute; left: 0; right: 0; top: 150px; height: 420px; background: linear-gradient(100deg, var(--teal) 0 48%, var(--ink) 48% 52%, var(--red) 52% 100%); border-top: 6px solid var(--ink); border-bottom: 6px solid var(--ink); }
#versus canvas { position: absolute; top: 120px; }
#versus .vs { position: absolute; left: 0; right: 0; top: 268px; text-align: center; font-family: var(--display); font-weight: 900; font-style: italic; font-size: 150px; color: var(--yellow); -webkit-text-stroke: 3px var(--ink); text-shadow: 6px 6px 0 var(--ink); line-height: 1; }
#versus .nm { position: absolute; top: 470px; font-family: var(--display); font-weight: 900; font-style: italic; font-size: 60px; color: #fff3d6; -webkit-text-stroke: 2px var(--ink); text-shadow: 4px 4px 0 var(--ink); text-transform: uppercase; line-height: .9; white-space: nowrap; }
#versus .nm small { display: block; font-family: var(--text); font-style: normal; font-weight: 400; font-size: 19px; -webkit-text-stroke: 0; text-shadow: 2px 2px 0 var(--ink); text-transform: none; }
#versus .rank { position: absolute; left: 0; right: 0; top: 34px; line-height: 1; text-align: center; font-family: var(--display); font-weight: 900; font-size: 46px; color: #fff3d6; text-shadow: 3px 3px 0 var(--ink); text-transform: uppercase; }
#versus .rank span { font-family: var(--jp); color: var(--yellow); margin-right: 14px; }
#versus .go { position: absolute; left: 0; right: 0; bottom: 22px; text-align: center; }
#lab .reign { font-size: 14px; margin: 4px 0 2px; padding: 3px 6px; border: 2px solid var(--ink); background: #fff3c4; }
#versus .story { position: absolute; top: 590px; width: 500px; margin: 0; color: #fff3d6; font-size: 16px; line-height: 1.3; text-shadow: 1px 1px 0 var(--ink); }
#versus .purse { position: absolute; left: 0; right: 0; top: 96px; text-align: center; color: #fff3d6; font-size: 19px; text-shadow: 2px 2px 0 var(--ink); }

/* ---------- fight HUD ---------- */
#hud { pointer-events: none; }
#hud > * { pointer-events: auto; }
.plate { position: absolute; top: 10px; width: 430px; color: #fff3d6; }
.plate .hpbar, .plate .chips { width: 400px; }
.plate.e .hpbar, .plate.e .chips { margin-left: auto; }
.plate.p { left: 14px; }
.plate.e { right: 14px; text-align: right; }
.plate .nm { overflow: hidden; height: 36px; font-family: var(--display); font-weight: 900; font-style: italic; font-size: 34px; line-height: .95; text-transform: uppercase; -webkit-text-stroke: 1.5px var(--ink); text-shadow: 3px 3px 0 var(--ink); white-space: nowrap; }
.plate .nm span { font-family: var(--jpg); font-style: normal; font-size: 15px; -webkit-text-stroke: 0; color: var(--yellow); margin: 0 8px; text-shadow: 2px 2px 0 var(--ink); }
.hpbar { height: 26px; border: 3px solid var(--ink); background: #2a2119; position: relative; margin-top: 3px; box-shadow: 3px 3px 0 rgba(0,0,0,.5); }
.hpbar .ghost, .hpbar .fill { position: absolute; top: 0; bottom: 0; left: 0; }
.plate.e .hpbar .ghost, .plate.e .hpbar .fill { left: auto; right: 0; }
.hpbar .ghost { background: #fff3d6; transition: width .7s .25s ease-out; }
.hpbar .fill { background: linear-gradient(180deg, #ffd95a, #f2a81e); transition: width .18s; }
.plate.e .hpbar .fill { background: linear-gradient(180deg, #ff7a5a, #d6321f); }
.hpbar .num { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: var(--display); font-weight: 900; font-size: 20px; color: #fff; text-shadow: 0 0 4px #000, 1px 1px 0 #000; }
.hpbar .form { position: absolute; top: -3px; bottom: -3px; width: 12px; border: 3px solid var(--ink); background: var(--red); right: -18px; }
.plate.e .hpbar .form { right: auto; left: -18px; }
.plate .kit { display: inline-flex; gap: 3px; vertical-align: 4px; margin: 0 10px; font-style: normal; }
.plate .kit img { width: 24px; height: 24px; padding: 2px; background: rgba(14,12,20,.78); border: 1.5px solid #fff3d6; border-radius: 3px; pointer-events: auto; }
.plate .kit img.t2 { border-color: var(--yellow); }
.chips { display: flex; gap: 4px; margin-top: 5px; flex-wrap: wrap; min-height: 26px; }
.plate.e .chips { justify-content: flex-end; }
.chip { display: flex; align-items: center; gap: 3px; background: var(--paper-lt); color: var(--ink); border: 2px solid var(--ink); font-family: var(--display); font-weight: 800; font-size: 15px; padding: 0 6px 0 3px; height: 24px; text-transform: uppercase; cursor: help; }
.chip img { width: 16px; height: 16px; }
.chip.bad { background: #ffb3a0; } .chip.good { background: #b8f0c8; } .chip.note { background: var(--yellow); }
#intent { position: absolute; right: 14px; top: 104px; width: 320px; background: #fff8e2; border: 3px solid var(--ink); box-shadow: 5px 5px 0 var(--red); padding: 5px 10px 6px; text-align: left; }
#intent .lbl { font-family: var(--display); font-weight: 900; font-size: 14px; text-transform: uppercase; color: var(--red); letter-spacing: .04em; }
#intent .mv { display: flex; align-items: center; gap: 8px; margin-top: 1px; }
#intent .mv img { width: 34px; height: 34px; flex: none; }
#intent .mv b { font-family: var(--display); font-weight: 900; font-size: 25px; text-transform: uppercase; line-height: .95; display: block; }
#intent .mv span { font-size: 13px; line-height: 1.2; display: block; }
#intent .mv.off b { text-decoration: line-through; color: #8a7d62; }
#intent .mv + .mv { margin-top: 5px; border-top: 2px dotted var(--ink); padding-top: 4px; }
#envs { position: absolute; left: 50%; top: 8px; transform: translateX(-50%); display: flex; gap: 3px; align-items: center; background: rgba(10,8,16,.55); padding: 4px 8px; border: 2px solid var(--ink); }
#envs i { width: 13px; height: 20px; border: 1.5px solid #fff3d6; opacity: .35; display: block; }
#envs i.on { background: var(--yellow); border-color: var(--ink); opacity: 1; box-shadow: inset 0 -6px 0 var(--red); }
#envs span { font-family: var(--display); font-weight: 800; font-size: 13px; color: #fff3d6; margin-right: 5px; text-transform: uppercase; }
#tray { position: absolute; left: 0; right: 0; bottom: 0; height: 112px; background: linear-gradient(180deg, rgba(10,8,16,0), rgba(10,8,16,.82) 30%); display: flex; align-items: flex-end; gap: 7px; padding: 0 12px 9px; }
.mvbtn { width: 108px; height: 92px; background: var(--paper-lt); border: 3px solid var(--ink); box-shadow: 4px 4px 0 var(--ink); position: relative; padding: 0; text-align: center; font-family: var(--display); flex: none; }
.mvbtn:hover:not(.dis), .mvbtn.kb { background: var(--yellow); transform: translateY(-4px); }
.mvbtn img { width: 34px; height: 34px; margin-top: 7px; }
.mvbtn .n { display: block; font-weight: 900; font-size: 17px; text-transform: uppercase; line-height: .95; padding: 0 3px; margin-top: 1px; }
.mvbtn .d { display: block; font-weight: 800; font-size: 15px; color: var(--red); line-height: 1.1; }
.mvbtn .key { position: absolute; left: 3px; top: 1px; font-weight: 900; font-size: 15px; color: #6d6450; }
.mvbtn .rg { position: absolute; right: 4px; top: 3px; display: flex; gap: 2px; }
.mvbtn .rg i { width: 6px; height: 6px; background: #c9bc98; display: block; }
.mvbtn .rg i.on { background: var(--teal); }
.mvbtn.dis { background: #a99f86; color: #5c5341; box-shadow: 2px 2px 0 var(--ink); cursor: not-allowed; }
.mvbtn.dis img { opacity: .4; }
.mvbtn.dis .d { color: #5c5341; font-size: 13.5px; }
.mvbtn .cd { position: absolute; inset: 0; background: rgba(26,20,16,.72); color: #fff3d6; font-weight: 900; font-size: 44px; display: flex; align-items: center; justify-content: center; }
#fore { flex: 1; min-width: 0; height: 92px; background: rgba(255,248,226,.95); border: 3px solid var(--ink); box-shadow: 4px 4px 0 var(--ink); padding: 5px 10px; font-size: 14.5px; line-height: 1.28; overflow: hidden; }
#fore b.t { font-family: var(--display); font-weight: 900; font-size: 20px; text-transform: uppercase; display: block; line-height: 1; margin-bottom: 2px; }
#fore .big { font-family: var(--display); font-weight: 900; font-size: 19px; }
#fore .dealt { color: var(--teal); } #fore .taken { color: var(--red); }
#side { display: flex; flex-direction: column; gap: 5px; flex: none; }
#side button { width: 42px; height: 27px; padding: 0; font-family: var(--display); font-weight: 900; font-size: 15px; background: var(--paper-lt); border: 2px solid var(--ink); box-shadow: 2px 2px 0 var(--ink); }
#side button.off { background: #8f866c; }
#banner { position: absolute; left: 0; right: 0; top: 300px; text-align: center; font-family: var(--display); font-weight: 900; font-style: italic; font-size: 110px; color: var(--yellow); -webkit-text-stroke: 3px var(--ink); text-shadow: 6px 6px 0 var(--red), 9px 9px 0 var(--ink); text-transform: uppercase; pointer-events: none; opacity: 0; line-height: .9; }
#banner small { display: block; font-family: var(--jp); font-style: normal; font-size: 54px; color: #fff3d6; -webkit-text-stroke: 0; text-shadow: 4px 4px 0 var(--ink); }
#phase { position: absolute; left: 50%; top: 96px; transform: translateX(-50%); font-family: var(--display); font-weight: 900; font-size: 22px; color: #fff3d6; text-shadow: 2px 2px 0 var(--ink); text-transform: uppercase; white-space: nowrap; pointer-events: none; }
#coach { position: absolute; left: 14px; top: 112px; width: 430px; }
#logline { position: absolute; left: 0; right: 0; top: 126px; text-align: center; color: #fff3d6; font-size: 16px; text-shadow: 2px 2px 0 var(--ink), 0 0 6px #000; pointer-events: none; }

/* ---------- result + ending ---------- */
#result, #ending { background: rgba(6,6,14,.66); }
.card { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 760px; border: 4px solid var(--ink); box-shadow: 10px 10px 0 var(--ink); padding: 18px 26px 20px; }
.card h2 { font-family: var(--display); font-weight: 900; font-style: italic; font-size: 82px; margin: 0; line-height: .9; color: var(--red); text-transform: uppercase; }
.card h2 span { font-family: var(--jp); font-style: normal; font-size: 56px; color: var(--ink); margin-left: 16px; }
.card p { font-size: 17px; line-height: 1.4; margin: 8px 0; }
.payrow { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 2px dotted var(--ink); padding: 5px 0 2px; font-size: 18px; }
.payrow b { font-family: var(--display); font-weight: 900; font-size: 28px; }
.payrow.total b { font-size: 46px; color: var(--red); }
.envrow { display: flex; gap: 6px; margin: 8px 0 2px; min-height: 46px; flex-wrap: wrap; }
.env { width: 30px; height: 44px; background: #fff8e2; border: 2px solid var(--ink); position: relative; box-shadow: 2px 2px 0 var(--ink); animation: drop .25s ease-out; }
.env::before { content: ""; position: absolute; left: 0; right: 0; top: 15px; height: 10px; background: var(--red); }
.env::after { content: "賞"; position: absolute; left: 0; right: 0; top: 12px; text-align: center; font-family: var(--jp); font-size: 13px; color: #fff3d6; font-weight: 900; }
@keyframes drop { from { transform: translateY(-30px) rotate(-10deg); opacity: 0; } to { transform: none; opacity: 1; } }
.card .acts { display: flex; gap: 14px; justify-content: flex-end; margin-top: 14px; }
#ending .card { width: 980px; }
#ending canvas { float: right; margin: -6px -8px 0 16px; border: 3px solid var(--ink); background: linear-gradient(180deg, #2a0f30, #8c2432 60%, #f0843a 78%, #b79a6a 78%); }
.hall { font-size: 15px; margin: 6px 0 0; padding: 0; list-style: none; }
.hall li { border-bottom: 1px dotted var(--ink); padding: 2px 0; }

/* ---------- help / modal ---------- */
#modal { background: rgba(6,6,14,.72); z-index: 20; }
#modal .card { width: 1040px; max-height: 704px; overflow: auto; padding: 12px 26px 14px; }
#modal h2 { font-size: 44px; }
#modal .acts { margin-top: 8px; }
#modal h4 { font-family: var(--display); font-weight: 900; font-size: 20px; margin: 7px 0 1px; text-transform: uppercase; color: var(--teal); }
#modal .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 0 28px; }
#modal p, #modal li { font-size: 15px; line-height: 1.33; margin: 2px 0; }
#modal ul { margin: 2px 0; padding-left: 18px; }
#tip { position: absolute; z-index: 30; max-width: 300px; background: #fff8e2; border: 2.5px solid var(--ink); box-shadow: 4px 4px 0 var(--ink); padding: 6px 9px; font-size: 13.5px; line-height: 1.3; pointer-events: none; display: none; }
#tip b { font-family: var(--display); font-weight: 900; font-size: 18px; text-transform: uppercase; display: block; line-height: 1; margin-bottom: 2px; }
#tip ul { margin: 2px 0 0; padding-left: 15px; }
#fade { position: absolute; inset: 0; background: #000; opacity: 0; pointer-events: none; z-index: 40; transition: opacity .28s; }
#fade.on { opacity: 1; }
@media (prefers-reduced-motion: reduce) { .env { animation: none; } .hpbar .ghost, .hpbar .fill, #fade { transition: none; } }

</style>

<body>
<div id="stage">
  <canvas id="cv" width="1280" height="720"></canvas>
  <div id="hud" class="layer"></div>
  <div id="title" class="layer"></div>
  <div id="hatch" class="layer paper"></div>
  <div id="lab" class="layer paper"></div>

</div>
<noscript>Kaiju Basho needs JavaScript.</noscript>
<script>
/* KAIJU BASHO — data: traits, strains, opponents. Pure data, shared by game and simulator. */
(function () {
  'use strict';
  var KB = globalThis.KB || (globalThis.KB = {});

  KB.SLOTS = ['maw', 'arms', 'tail', 'back', 'legs', 'hide', 'core'];
  KB.SLOT_NAMES = { maw: 'Maw', arms: 'Arms', tail: 'Tail', back: 'Back', legs: 'Legs', hide: 'Hide', core: 'Core' };
  KB.SLOT_JP = { maw: '口', arms: '腕', tail: '尾', back: '背', legs: '脚', hide: '皮', core: '核' };

  // ---- moves every kaiju has -------------------------------------------------
  KB.BASIC = {
    strike: { id: 'strike', name: 'Strike', icon: 'strike', range: [1, 1], hits: 1, dmg: 6, type: 'phys', cd: 0, melee: true, basic: true },
    brace: { id: 'brace', name: 'Brace', icon: 'brace', util: 'brace', cd: 0, basic: true }
  };

  // ---- trait catalog ---------------------------------------------------------
  // Each trait: slot, two tiers. A tier may carry a move (active) and/or pas (passive modifiers).
  // Move flags: foil = aimed from range, so Camouflage makes it miss. melee = body contact
  // (Spines and Fortress Shell punish it). quake = reaches a burrowed kaiju.
  var T = KB.TRAITS = {};
  function trait(id, slot, o) { o.id = id; o.slot = slot; T[id] = o; }

  // MAW
  trait('fire', 'maw', {
    name: 'Fire Breath', jp: '火炎',
    pitch: 'A furnace where the tonsils used to be.',

    tiers: [
      { name: 'Fire Breath', cost: 700, move: { id: 'fire', name: 'Fire Breath', icon: 'fire', range: [1, 3], hits: 1, dmg: 7, type: 'fire', cd: 2, burn: [3, 2] } },
      { name: 'White Heat', cost: 900, move: { id: 'fire', name: 'White Heat', icon: 'fire', range: [1, 4], hits: 1, dmg: 10, type: 'fire', cd: 2, burn: [4, 2] } }
    ]
  });
  trait('venom', 'maw', {
    name: 'Venom Spit', jp: '毒液',
    pitch: 'Reaches the cheap seats. Stains.',

    tiers: [
      { name: 'Venom Spit', cost: 650, move: { id: 'venom', name: 'Venom Spit', icon: 'venom', range: [2, 5], hits: 1, dmg: 4, type: 'toxin', cd: 1, poison: 4, foil: true } },

    ]

  trait('shriek', 'maw', {
    name: 'Sonic Shriek', jp: '音波',
    pitch: 'Every window in the prefecture, gone.',
    role: 'Dazes: the foe\'s announced special becomes a weak Strike. Reveals hidden kaiju and drags up burrowers.',
    tiers: [
      { name: 'Sonic Shriek', cost: 600, move: { id: 'shriek', name: 'Sonic Shriek', icon: 'shriek', range: [1, 4], hits: 1, dmg: 7, type: 'sonic', cd: 3, daze: 1, ping: 2, quake: true } },
      { name: 'Banshee Howl', cost: 800, move: { id: 'shriek', name: 'Banshee Howl', icon: 'shriek', range: [1, 5], hits: 1, dmg: 9, type: 'sonic', cd: 2, daze: 1, ping: 3, quake: true } }
    ]
  });

  // ARMS
  trait('claws', 'arms', {
    name: 'Claws', jp: '爪',
    pitch: 'Three talons per hand. Sharpen on bridges.',
    role: 'Many small hits, every turn. Shredding against bare hide, feeble against armor, painful against spines.',
    tiers: [
      { name: 'Claws', cost: 600, move: { id: 'claws', name: 'Claws', icon: 'claws', range: [1, 1], hits: 3, dmg: 4, type: 'phys', cd: 0, melee: true } },
      { name: 'Rending Talons', cost: 800, move: { id: 'claws', name: 'Rending Talons', icon: 'claws', range: [1, 1], hits: 4, dmg: 5, type: 'phys', cd: 0, melee: true } }
    ]
  });
  trait('hammer', 'arms', {
    name: 'Hammer Fists', jp: '鉄拳',
    pitch: 'Knuckles like harbour bollards.',

    tiers: [
      { name: 'Hammer Fists', cost: 650, move: { id: 'hammer', name: 'Hammer Fists', icon: 'hammer', range: [1, 1], hits: 1, dmg: 11, type: 'phys', cd: 1, kb: 2, crack: 1, melee: true } },
      { name: 'Pile Driver', cost: 850, move: { id: 'hammer', name: 'Pile Driver', icon: 'hammer', range: [1, 1], hits: 1, dmg: 15, type: 'phys', cd: 1, kb: 2, crack: 2, crashStun: 1, melee: true } }
    ]

  trait('tentacles', 'arms', {
    name: 'Tentacles', jp: '触手',
    pitch: 'Why walk over there when there can come here?',
    role: 'Reaches out, drags the foe adjacent and Holds it. A held kaiju cannot move and takes extra damage from everything.',
    tiers: [
      { name: 'Tentacles', cost: 550, move: { id: 'grapple', name: 'Grapple', icon: 'grapple', range: [1, 3], hits: 1, dmg: 9, type: 'phys', cd: 2, pull: true, hold: 1, melee: true, foil: true } },

    ]

  // TAIL
  trait('club', 'tail', {

    pitch: 'A wrecking ball with a spine attached.',

      { name: 'Club Tail', cost: 550, move: { id: 'club', name: 'Club Tail', icon: 'club', range: [1, 2], hits: 1, dmg: 9, type: 'phys', cd: 2, kb: 2, melee: true } },

  trait('stinger', 'tail', {

      { name: 'Stinger', cost: 600, move: { id: 'sting', name: 'Stinger', icon: 'sting', range: [1, 2], hits: 1, dmg: 4, type: 'phys', pierce: true, cd: 2, poison: 3, melee: true } },

  trait('scythe', 'tail', {

      { name: 'Scythe Tail', cost: 550, move: { id: 'scythe', name: 'Scythe Tail', icon: 'scythe', range: [1, 2], hits: 2, dmg: 6, type: 'phys', cd: 1, ham: 2, melee: true } },
      { name: 'Reaper Tail', cost: 750, move: { id: 'scythe', name: 'Reaper Tail', icon: 'scythe', range: [1, 2], hits: 2, dmg: 8, type: 'phys', cd: 1, ham: 3, melee: true } }
    ]

  // BACK
  trait('wings', 'back', {
    name: 'Wings', jp: '翼',
    pitch: 'Wingspan: one city block. Updraft: all the laundry.',
    role: 'Faster, and you can fly over the foe to escape a corner. Gust blows it away from you.',
    tiers: [
      { name: 'Wings', cost: 700, pas: { spd: 1, cross: true }, move: { id: 'gust', name: 'Gust', icon: 'gust', range: [1, 3], hits: 1, dmg: 6, type: 'sonic', cd: 2, kb: 2 } },

    name: 'Dorsal Spines', jp: '棘',

      await to(p, { rot: -0.5, lean: -0.2, jaw: 0.6, x: -14 }, 420, ease.out);
      UI.speed = UI.meta.fast ? 2 : 1;
      await to(p, { rot: -1.3, y: -20, x: -40, tailBase: 1.3, tailLift: -0.16 }, 380, ease.in);
      Snd.play('ko'); scene.shake(34); scene.burst('dust', p.x - p.face * 90, GROUND + 4, { n: 26, spread: 220 }); scene.burst('dirt', p.x - p.face * 90, GROUND, { n: 14 });
      to(p, { rot: -1.36, y: -16 }, 160, ease.out);
      if (e.who === 1) { Snd.cheer(1.5); scene.addHype(1.5); } else Snd.gasp();
      log(name(e.who) + ' is down.');
      await UI.wait(700);
    },
    timeout: async function (e) { Snd.play('gong'); log('Thirty turns. The judges confer.'); await banner('Time!', '物言い', 1400); },
    intent: async function () { renderIntent(); }
  };
})();

</script>
<script>KB.UI.boot();</script>
